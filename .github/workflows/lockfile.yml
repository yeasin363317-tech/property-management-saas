name: Lockfile, audit and build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', 'src/**', 'database/**', 'supabase/**', 'ci/**', '.github/workflows/**']

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "Add package-lock.json"
            git push
          fi

      - name: Install from lockfile
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: High-severity dependency audit
        run: npm audit --audit-level=high

      - name: Schema parity checks
        run: ./ci/check-schema-parity.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
